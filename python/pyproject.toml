[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "apex-cli"
version = "1.0.0"
description = "APEX CLI - Command line interface for APEX intelligence platform"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "APEX Team", email = "team@apex.dev"}
]
keywords = ["apex", "cli", "intelligence", "monitoring", "regulatory"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Utilities",
]
requires-python = ">=3.9"
dependencies = [
    "click>=8.0.0",
    "requests>=2.28.0",
    "tabulate>=0.9.0",
    "rich>=13.0.0",
    "python-dateutil>=2.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[project.scripts]
apex = "apex_cli:main"

[project.urls]
Homepage = "https://github.com/apex-dev/cli"
Repository = "https://github.com/apex-dev/cli.git"
Documentation = "https://apex.dev/docs"

[tool.setuptools]
packages = ["apex_cli"]

[tool.setuptools.package-data]
apex_cli = ["py.typed"]
